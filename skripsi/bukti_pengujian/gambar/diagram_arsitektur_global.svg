  <text x="422" y="267" font-size="9.2" text-anchor="middle">• Penyelarasan Label Verdict Sumber</text>
  <text x="422" y="280" font-size="9.2" text-anchor="middle">• Pembentukan Objek AnalysisResult</text>

  <rect x="311" y="308" width="223" height="48" rx="4" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="422" y="326" font-size="10.5" font-weight="bold" text-anchor="middle">Penyimpanan Lokal (storage.ts)</text>
  <text x="422" y="340" font-size="9.2" text-anchor="middle">server/data/analysis_history.json</text>

  <path d="M422,112 L422,128" fill="none" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arrA)"/>
  <path d="M422,206 L422,222" fill="none" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arrA)"/>
  <path d="M422,294 L422,308" fill="none" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arrA)"/>

