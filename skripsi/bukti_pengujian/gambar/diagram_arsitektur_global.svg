  <text x="693" y="146" font-size="9" text-anchor="middle">4. Filter relevansi konteks klaim</text>

  <rect x="596" y="186" width="194" height="86" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.2"/>
  <text x="693" y="204" font-size="10.5" font-weight="bold" text-anchor="middle">Jalur Cadangan: Google News RSS</text>
  <text x="693" y="218" font-size="9.2" text-anchor="middle">(news.google.com/rss/search)</text>
  <text x="693" y="233" font-size="9" text-anchor="middle">• Skor tumpang-tindih kata kunci (×10)</text>
  <text x="693" y="246" font-size="9" text-anchor="middle">• Bonus istilah cek fakta (+3)</text>
  <text x="693" y="259" font-size="9" text-anchor="middle">• Bonus penerbit tepercaya (+2)</text>

  <rect x="596" y="292" width="194" height="64" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="693" y="310" font-size="10" font-weight="bold" text-anchor="middle" fill="#334155">LLM Cadangan Opsional</text>
  <text x="693" y="324" font-size="9" text-anchor="middle" fill="#475569">(Gemini / OpenAI / Claude)</text>
