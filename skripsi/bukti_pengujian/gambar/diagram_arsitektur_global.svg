  <text x="138" y="86" font-size="9.5" text-anchor="middle">(threads.com / threads.net)</text>
  <text x="138" y="100" font-size="9" text-anchor="middle" fill="#334155">DOM Post + Badge &amp; Tooltip Hasil</text>

  <rect x="32" y="136" width="213" height="68" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="138" y="154" font-size="10.5" font-weight="bold" text-anchor="middle">Content Script (src/content/)</text>
  <text x="138" y="168" font-size="9.2" text-anchor="middle">• postExtractor.ts (findPost, extract)</text>
  <text x="138" y="181" font-size="9.2" text-anchor="middle">• badge.ts (injectLoading/Result/Error)</text>
  <text x="138" y="194" font-size="9.2" text-anchor="middle">• index.ts (contextmenu listener)</text>

  <rect x="32" y="224" width="213" height="66" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
  <text x="138" y="242" font-size="10.5" font-weight="bold" text-anchor="middle">Background Service Worker</text>
  <text x="138" y="256" font-size="9.2" text-anchor="middle">• Menu Klik Kanan (contextMenus)</text>
  <text x="138" y="269" font-size="9.2" text-anchor="middle">• Fetch POST /api/analyze (timeout 70s)</text>
  <text x="138" y="282" font-size="9.2" text-anchor="middle">• Simpan Riwayat (chrome.storage.local)</text>

  <rect x="32" y="306" width="213" height="52" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <text x="138" y="324" font-size="10.5" font-weight="bold" text-anchor="middle">React Popup UI (src/popup/)</text>
  <text x="138" y="338" font-size="9.2" text-anchor="middle">Dashboard • Riwayat • Pengaturan Tema</text>

  <path d="M138,116 L138,136" fill="none" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arrA)"/>
  <path d="M138,204 L138,224" fill="none" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arrA)"/>
  <path d="M138,290 L138,306" fill="none" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arrA)"/>

