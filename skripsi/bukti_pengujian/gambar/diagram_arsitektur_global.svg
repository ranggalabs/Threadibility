  <text x="422" y="186" font-size="9.2" text-anchor="middle">• Penggabungan &amp; Deduplikasi Sumber</text>

  <rect x="311" y="222" width="223" height="72" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
