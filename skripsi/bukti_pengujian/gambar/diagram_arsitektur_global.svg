  <text x="693" y="107" font-size="9" text-anchor="middle">1. Kueri utuh + "hoaks fakta"</text>
  <text x="693" y="120" font-size="9" text-anchor="middle">2. Ekstraksi &amp; sanitasi Ringkasan AI</text>
