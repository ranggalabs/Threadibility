<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" width="100%" style="max-width:660px;display:block;margin:6pt auto;font-family:'Times New Roman',serif;">
  <rect x="2" y="2" width="736" height="336" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <!-- System Boundary -->
  <rect x="190" y="18" width="520" height="304" rx="6" fill="#f8fafc" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="450" y="38" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Sistem Ekstensi Chrome Threadibility</text>

  <!-- Actor: Pengguna Threads -->
  <circle cx="75" cy="135" r="16" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.5"/>
  <line x1="75" y1="151" x2="75" y2="200" stroke="#1e3a8a" stroke-width="1.5"/>
  <line x1="48" y1="168" x2="102" y2="168" stroke="#1e3a8a" stroke-width="1.5"/>
  <line x1="75" y1="200" x2="52" y2="235" stroke="#1e3a8a" stroke-width="1.5"/>
  <line x1="75" y1="200" x2="98" y2="235" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="75" y="254" font-size="10.5" font-weight="bold" text-anchor="middle">Pengguna Threads</text>

  <!-- Use Cases -->
  <ellipse cx="345" cy="75" rx="115" ry="22" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="345" y="79" font-size="10" font-weight="bold" text-anchor="middle">UC-01: Memicu Cek Keaslian Post</text>

  <ellipse cx="600" cy="75" rx="92" ry="22" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="600" y="72" font-size="9.2" font-weight="bold" text-anchor="middle">UC-02: Ekstraksi &amp; Analisis</text>
  <text x="600" y="84" font-size="8.8" text-anchor="middle">Klaim via Backend</text>

  <ellipse cx="345" cy="135" rx="115" ry="22" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
  <text x="345" y="139" font-size="10" font-weight="bold" text-anchor="middle">UC-03: Melihat Badge &amp; Tooltip Hasil</text>

  <ellipse cx="600" cy="135" rx="92" ry="22" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="600" y="132" font-size="9.2" font-weight="bold" text-anchor="middle">UC-04: Membuka Tautan</text>
  <text x="600" y="144" font-size="8.8" text-anchor="middle">Sumber Rujukan Cek Fakta</text>

  <ellipse cx="345" cy="195" rx="115" ry="22" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <text x="345" y="199" font-size="10" font-weight="bold" text-anchor="middle">UC-05: Melihat Statistik Dashboard</text>

  <ellipse cx="345" cy="250" rx="115" ry="22" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <text x="345" y="254" font-size="10" font-weight="bold" text-anchor="middle">UC-06: Menelusuri Riwayat Analisis</text>

  <ellipse cx="345" cy="298" rx="115" ry="19" fill="#f3e8ff" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="345" y="302" font-size="9.8" font-weight="bold" text-anchor="middle">UC-07: Mengatur Tema &amp; Hapus Riwayat</text>

  <!-- Associations -->
  <line x1="110" y1="155" x2="230" y2="75" stroke="#1e293b" stroke-width="1.2"/>
  <line x1="110" y1="162" x2="230" y2="135" stroke="#1e293b" stroke-width="1.2"/>
  <line x1="110" y1="170" x2="230" y2="195" stroke="#1e293b" stroke-width="1.2"/>
  <line x1="110" y1="178" x2="230" y2="250" stroke="#1e293b" stroke-width="1.2"/>
  <line x1="110" y1="186" x2="230" y2="298" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Include & Extend -->
  <line x1="460" y1="75" x2="508" y2="75" stroke="#475569" stroke-width="1.1" stroke-dasharray="4,3"/>
  <text x="484" y="68" font-size="8.5" font-style="italic" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <line x1="508" y1="135" x2="460" y2="135" stroke="#475569" stroke-width="1.1" stroke-dasharray="4,3"/>
