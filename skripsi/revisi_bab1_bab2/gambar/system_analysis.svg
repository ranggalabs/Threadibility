<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350" style="background:#ffffff;font-family:Helvetica,Arial,sans-serif;color:#000000;">
  
  <defs>
    <marker id="classic" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 L 2.3 5 Z" fill="#000000" stroke="#000000" stroke-width="0.8"/>
    </marker>
  </defs>


  <!-- Outer Frame like DRAFT 10 Gambar 3.2 -->
  <rect x="50" y="14" width="500" height="322" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <line x1="50" y1="38" x2="550" y2="38" stroke="#000000" stroke-width="1"/>
  <text x="300" y="31" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">Tahapan Analisis Sistem (<tspan font-style="italic">System Analysis</tspan>)</text>

  <!-- Step 1: Identify -->
  <rect x="90" y="54" width="420" height="48" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="300" y="73" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#000000">1. <tspan font-style="italic">Identify</tspan> (Identifikasi Masalah Sistem Berjalan)</text>
  <text x="300" y="90" font-size="10.5" text-anchor="middle" fill="#000000">Mengidentifikasi ketiadaan fitur cek fakta langsung pada halaman <tspan font-style="italic">web</tspan> Threads</text>

  <line x1="300" y1="102" x2="300" y2="123" stroke="#000000" stroke-width="1" marker-end="url(#classic)"/>

  <!-- Step 2: Understand -->
  <rect x="90" y="124" width="420" height="48" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="300" y="143" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#000000">2. <tspan font-style="italic">Understand</tspan> (Pemahaman Karakteristik Objek &amp; Pengguna)</text>
  <text x="300" y="160" font-size="10.5" text-anchor="middle" fill="#000000">Mempelajari struktur DOM unggahan Threads dan hasil kuesioner 60 responden</text>

  <line x1="300" y1="172" x2="300" y2="193" stroke="#000000" stroke-width="1" marker-end="url(#classic)"/>

  <!-- Step 3: Analyze -->
  <rect x="90" y="194" width="420" height="48" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="300" y="213" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#000000">3. <tspan font-style="italic">Analyze</tspan> (Analisis Kebutuhan &amp; Mekanisme Verifikasi)</text>
  <text x="300" y="230" font-size="10.5" text-anchor="middle" fill="#000000">Menganalisis kebutuhan fungsional, normalisasi NFKC, dan penelusuran bukti <tspan font-style="italic">web</tspan></text>

  <line x1="300" y1="242" x2="300" y2="263" stroke="#000000" stroke-width="1" marker-end="url(#classic)"/>

  <!-- Step 4: Report / Specify -->
  <rect x="90" y="264" width="420" height="48" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="300" y="283" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#000000">4. <tspan font-style="italic">Report</tspan> (Penyusunan Spesifikasi Kebutuhan Sistem)</text>
  <text x="300" y="300" font-size="10.5" text-anchor="middle" fill="#000000">Merumuskan spesifikasi kebutuhan sebagai acuan perancangan UML dan antarmuka</text>
</svg>