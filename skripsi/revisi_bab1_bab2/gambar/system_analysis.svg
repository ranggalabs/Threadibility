<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 381" width="500" height="381" style="background:#ffffff;font-family:Helvetica,Arial,sans-serif;color:#000000;">
  <defs><marker id="classic" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 L 2.3 5 Z" fill="#000000" stroke="#000000" stroke-width="0.8"/></marker></defs>
  <rect x="0" y="0" width="500" height="381" fill="#ffffff"/>
  <rect x="8" y="8" width="484" height="365.3" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <line x1="8" y1="36.5" x2="492" y2="36.5" stroke="#000000" stroke-width="1"/>
  <text x="250.0" y="26.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#000000">Tahapan Analisis Sistem (<tspan font-style="italic">System Analysis</tspan>)</text>
  <rect x="24" y="50.5" width="452" height="62.2" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="250.0" y="70.1" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">1. <tspan font-style="italic">Identify</tspan> (Identifikasi Masalah Sistem Berjalan)</text>
  <text x="250.0" y="85.4" font-size="11.5" text-anchor="middle" fill="#000000">Mengidentifikasi ketiadaan fitur cek fakta langsung</text>
  <text x="250.0" y="100.6" font-size="11.5" text-anchor="middle" fill="#000000">pada halaman <tspan font-style="italic">web</tspan> Threads</text>
  <path d="M 250 112.7 L 250 131.7" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#classic)"/>
  <rect x="24" y="132.7" width="452" height="62.2" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="250.0" y="152.3" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">2. <tspan font-style="italic">Understand</tspan> (Pemahaman Karakteristik Objek &amp; Pengguna)</text>
  <text x="250.0" y="167.6" font-size="11.5" text-anchor="middle" fill="#000000">Mempelajari struktur DOM unggahan Threads dan</text>
  <text x="250.0" y="182.8" font-size="11.5" text-anchor="middle" fill="#000000">hasil kuesioner 60 responden</text>
  <path d="M 250 194.89999999999998 L 250 213.89999999999998" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#classic)"/>
  <rect x="24" y="214.89999999999998" width="452" height="62.2" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="250.0" y="234.5" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">3. <tspan font-style="italic">Analyze</tspan> (Analisis Kebutuhan &amp; Mekanisme Verifikasi)</text>
  <text x="250.0" y="249.8" font-size="11.5" text-anchor="middle" fill="#000000">Menganalisis kebutuhan fungsional, normalisasi NFKC,</text>
  <text x="250.0" y="265.0" font-size="11.5" text-anchor="middle" fill="#000000">dan penelusuran bukti <tspan font-style="italic">web</tspan></text>
  <path d="M 250 277.09999999999997 L 250 296.09999999999997" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#classic)"/>
  <rect x="24" y="297.09999999999997" width="452" height="62.2" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="250.0" y="316.7" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">4. <tspan font-style="italic">Report</tspan> (Penyusunan Spesifikasi Kebutuhan Sistem)</text>
  <text x="250.0" y="332.0" font-size="11.5" text-anchor="middle" fill="#000000">Merumuskan spesifikasi kebutuhan sebagai acuan</text>
  <text x="250.0" y="347.2" font-size="11.5" text-anchor="middle" fill="#000000">perancangan UML dan antarmuka</text>
</svg>
