<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" width="700" height="290" style="background:#ffffff;font-family:Helvetica,Arial,sans-serif;color:#000000;">
  
  <defs>
    <marker id="classic" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 L 2.3 5 Z" fill="#000000" stroke="#000000" stroke-width="0.8"/>
    </marker>
  </defs>


  <!-- Container: Komponen Pembentuk Sistem (System Engineering) -->
  <rect x="20" y="14" width="660" height="122" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <line x1="20" y1="38" x2="680" y2="38" stroke="#000000" stroke-width="1"/>
  <text x="350" y="31" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">Komponen Pembentuk Rekayasa Sistem (<tspan font-style="italic">System Engineering</tspan>)</text>

  <!-- Box 1: Hardware -->
  <rect x="36" y="54" width="146" height="64" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="109" y="72" font-size="11" font-weight="bold" text-anchor="middle" fill="#000000">Perangkat Keras</text>
  <text x="109" y="86" font-size="10" font-style="italic" text-anchor="middle" fill="#000000">(Hardware)</text>
  <text x="109" y="104" font-size="9.5" text-anchor="middle" fill="#000000">Komputer Klien &amp; <tspan font-style="italic">Server</tspan></text>

  <!-- Box 2: Software -->
  <rect x="196" y="54" width="146" height="64" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="269" y="72" font-size="11" font-weight="bold" text-anchor="middle" fill="#000000">Perangkat Lunak</text>
  <text x="269" y="86" font-size="10" font-style="italic" text-anchor="middle" fill="#000000">(Software)</text>
  <text x="269" y="104" font-size="9.5" text-anchor="middle" fill="#000000">Ekstensi Chrome &amp; API</text>

  <!-- Box 3: Brainware -->
  <rect x="356" y="54" width="146" height="64" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="429" y="72" font-size="11" font-weight="bold" text-anchor="middle" fill="#000000">Pengguna Sistem</text>
  <text x="429" y="86" font-size="10" font-style="italic" text-anchor="middle" fill="#000000">(Brainware)</text>
  <text x="429" y="104" font-size="9.5" text-anchor="middle" fill="#000000">Pengguna Media Sosial Threads</text>

  <!-- Box 4: Data & Network -->
  <rect x="516" y="54" width="148" height="64" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="590" y="72" font-size="11" font-weight="bold" text-anchor="middle" fill="#000000">Data &amp; Jaringan</text>
  <text x="590" y="86" font-size="10" font-style="italic" text-anchor="middle" fill="#000000">(Data &amp; Network)</text>
  <text x="590" y="104" font-size="9.5" text-anchor="middle" fill="#000000">DOM, JSON, &amp; Bukti <tspan font-style="italic">Web</tspan></text>

  <!-- Orthogonal merge lines to Integrasi Sistem -->
  <path d="M 109 118 L 109 152 L 350 152 L 350 169" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#classic)"/>
  <path d="M 269 118 L 269 152" fill="none" stroke="#000000" stroke-width="1"/>
  <path d="M 429 118 L 429 152" fill="none" stroke="#000000" stroke-width="1"/>
  <path d="M 590 118 L 590 152 L 350 152" fill="none" stroke="#000000" stroke-width="1"/>

  <!-- Box Integrasi -->
  <rect x="130" y="170" width="440" height="42" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="350" y="188" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#000000">Perumusan Batas dan Integrasi Sistem Secara Menyeluruh</text>
  <text x="350" y="203" font-size="10.5" text-anchor="middle" fill="#000000">(Penyelarasan Alur Ekstensi <tspan font-style="italic">Browser</tspan>, <tspan font-style="italic">Server Backend</tspan>, dan Pencarian <tspan font-style="italic">Real-Time</tspan>)</text>

  <line x1="350" y1="212" x2="350" y2="235" stroke="#000000" stroke-width="1" marker-end="url(#classic)"/>

  <!-- Box Output System Engineering -->
  <rect x="130" y="236" width="440" height="38" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="350" y="253" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#000000">Spesifikasi Arsitektur Tingkat Sistem</text>
  <text x="350" y="267" font-size="10.5" text-anchor="middle" fill="#000000">(Dasar Masukan bagi Tahap <tspan font-style="italic">System Analysis</tspan>)</text>
</svg>