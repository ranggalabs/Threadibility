<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 318" width="720" height="318" style="background:#ffffff;font-family:Helvetica,Arial,sans-serif;color:#000000;">
  
  <defs>
    <marker id="classic" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 L 2.3 5 Z" fill="#000000" stroke="#000000" stroke-width="0.8"/>
    </marker>
  </defs>


  <!-- 1. System Engineering -->
  <rect x="16" y="14" width="180" height="40" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="106" y="31" font-size="11.5" font-weight="bold" font-style="italic" text-anchor="middle" fill="#000000">System Engineering</text>
  <text x="106" y="46" font-size="10.5" text-anchor="middle" fill="#000000">(Rekayasa Sistem)</text>
  <path d="M 196 34 L 222 34 L 222 61" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#classic)"/>

  <!-- 2. System Analysis -->
  <rect x="118" y="62" width="180" height="40" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="208" y="79" font-size="11.5" font-weight="bold" font-style="italic" text-anchor="middle" fill="#000000">System Analysis</text>
  <text x="208" y="94" font-size="10.5" text-anchor="middle" fill="#000000">(Analisis Kebutuhan Sistem)</text>
  <path d="M 298 82 L 324 82 L 324 109" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#classic)"/>

  <!-- 3. System & Software Design -->
  <rect x="220" y="110" width="180" height="40" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="310" y="127" font-size="11.5" font-weight="bold" font-style="italic" text-anchor="middle" fill="#000000">System &amp; Software Design</text>
  <text x="310" y="142" font-size="10.5" text-anchor="middle" fill="#000000">(Perancangan Sistem)</text>
  <path d="M 400 130 L 426 130 L 426 157" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#classic)"/>

  <!-- 4. Implementation / Coding -->
  <rect x="322" y="158" width="180" height="40" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="412" y="175" font-size="11.5" font-weight="bold" font-style="italic" text-anchor="middle" fill="#000000">Implementation / Coding</text>
  <text x="412" y="190" font-size="10.5" text-anchor="middle" fill="#000000">(Implementasi Kode)</text>
  <path d="M 502 178 L 528 178 L 528 205" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#classic)"/>

  <!-- 5. Testing / Verification -->
  <rect x="424" y="206" width="180" height="40" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="514" y="223" font-size="11.5" font-weight="bold" font-style="italic" text-anchor="middle" fill="#000000">Testing / Verification</text>
  <text x="514" y="238" font-size="10.5" text-anchor="middle" fill="#000000">(Pengujian Sistem)</text>
  <path d="M 604 226 L 630 226 L 630 253" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#classic)"/>

  <!-- 6. Maintenance -->
  <rect x="526" y="254" width="180" height="40" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="616" y="271" font-size="11.5" font-weight="bold" font-style="italic" text-anchor="middle" fill="#000000">Maintenance</text>
  <text x="616" y="286" font-size="10.5" text-anchor="middle" fill="#000000">(Pemeliharaan Sistem)</text>
</svg>