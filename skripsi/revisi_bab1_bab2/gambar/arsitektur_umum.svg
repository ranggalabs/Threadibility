<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" style="background:#ffffff;font-family:Helvetica,Arial,sans-serif;color:#000000;">
  
  <defs>
    <marker id="classic" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 L 2.3 5 Z" fill="#000000" stroke="#000000" stroke-width="0.8"/>
    </marker>
  </defs>


  <!-- Swimlane 1: Sisi Klien -->
  <rect x="16" y="16" width="210" height="278" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <line x1="16" y1="42" x2="226" y2="42" stroke="#000000" stroke-width="1"/>
  <text x="121" y="34" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">Sisi Klien (Ekstensi Chrome)</text>

  <rect x="36" y="58" width="170" height="38" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="121" y="75" font-size="11" font-weight="bold" text-anchor="middle" fill="#000000">Halaman <tspan font-style="italic">Web</tspan> Threads</text>
  <text x="121" y="89" font-size="10" text-anchor="middle" fill="#000000">(DOM Unggahan &amp; <tspan font-style="italic">Badge</tspan>)</text>

  <line x1="121" y1="96" x2="121" y2="119" stroke="#000000" stroke-width="1" marker-start="url(#classic)" marker-end="url(#classic)"/>

  <rect x="36" y="120" width="170" height="36" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="121" y="142" font-size="11" font-weight="bold" font-style="italic" text-anchor="middle" fill="#000000">Content Script</text>

  <line x1="121" y1="156" x2="121" y2="179" stroke="#000000" stroke-width="1" marker-start="url(#classic)" marker-end="url(#classic)"/>

  <rect x="36" y="180" width="170" height="38" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="121" y="197" font-size="11" font-weight="bold" font-style="italic" text-anchor="middle" fill="#000000">Background</text>
  <text x="121" y="211" font-size="11" font-weight="bold" font-style="italic" text-anchor="middle" fill="#000000">Service Worker</text>

  <line x1="121" y1="218" x2="121" y2="241" stroke="#000000" stroke-width="1" marker-start="url(#classic)" marker-end="url(#classic)"/>

  <rect x="36" y="242" width="170" height="36" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="121" y="264" font-size="11" font-weight="bold" text-anchor="middle" fill="#000000">Antarmuka <tspan font-style="italic">Popup</tspan></text>

  <!-- Swimlane 2: Sisi Server -->
  <rect x="280" y="16" width="210" height="278" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <line x1="280" y1="42" x2="490" y2="42" stroke="#000000" stroke-width="1"/>
  <text x="385" y="34" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">Sisi <tspan font-style="italic">Server</tspan> (<tspan font-style="italic">Backend</tspan>)</text>

  <rect x="300" y="66" width="170" height="40" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="385" y="83" font-size="11" font-weight="bold" text-anchor="middle" fill="#000000">Layanan REST API</text>
  <text x="385" y="97" font-size="10" text-anchor="middle" fill="#000000">(Validasi &amp; Normalisasi Teks)</text>

  <line x1="385" y1="106" x2="385" y2="135" stroke="#000000" stroke-width="1" marker-end="url(#classic)"/>

  <rect x="300" y="136" width="170" height="40" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="385" y="153" font-size="11" font-weight="bold" text-anchor="middle" fill="#000000">Modul Penelusuran <tspan font-style="italic">Web</tspan></text>
  <text x="385" y="167" font-size="10" text-anchor="middle" fill="#000000">(Kueri &amp; Penyaringan Bukti)</text>

  <line x1="385" y1="176" x2="385" y2="205" stroke="#000000" stroke-width="1" marker-end="url(#classic)"/>

  <rect x="300" y="206" width="170" height="40" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="385" y="223" font-size="11" font-weight="bold" text-anchor="middle" fill="#000000">Modul Sintesis Hasil</text>
  <text x="385" y="237" font-size="10" text-anchor="middle" fill="#000000">(Status, Skor, &amp; Rujukan)</text>

  <!-- Swimlane 3: Sumber Pencarian Web -->
  <rect x="544" y="16" width="200" height="278" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <line x1="544" y1="42" x2="744" y2="42" stroke="#000000" stroke-width="1"/>
  <text x="644" y="34" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">Sumber Pencarian <tspan font-style="italic">Web</tspan></text>

  <rect x="564" y="92" width="160" height="44" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="644" y="111" font-size="11" font-weight="bold" text-anchor="middle" fill="#000000">Google AI Overview</text>
  <text x="644" y="126" font-size="10" text-anchor="middle" fill="#000000">(Jalur Utama)</text>

  <rect x="564" y="176" width="160" height="44" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="644" y="195" font-size="11" font-weight="bold" text-anchor="middle" fill="#000000">Google News RSS</text>
  <text x="644" y="210" font-size="10" text-anchor="middle" fill="#000000">(Jalur Cadangan)</text>

  <!-- Konektor Ortogonal Siku-Siku Khas Draw.io -->
  <!-- Background SW -> Layanan REST API -->
  <path d="M 206 192 L 253 192 L 253 86 L 299 86" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#classic)"/>
  <!-- Modul Sintesis Hasil -> Background SW -->
  <path d="M 300 226 L 253 226 L 253 206 L 207 206" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#classic)"/>

  <!-- Modul Penelusuran Web <-> Google AI Overview -->
  <path d="M 470 148 L 516 148 L 516 114 L 563 114" fill="none" stroke="#000000" stroke-width="1" marker-start="url(#classic)" marker-end="url(#classic)"/>
  <!-- Modul Penelusuran Web <-> Google News RSS -->
  <path d="M 470 164 L 516 164 L 516 198 L 563 198" fill="none" stroke="#000000" stroke-width="1" marker-start="url(#classic)" marker-end="url(#classic)"/>
</svg>